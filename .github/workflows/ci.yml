name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # Builds the real production image, starts it, and runs the Playwright browser tests against it
  # (M4 plan D19, D24). PokéAPI answers come from e2e/fixtures/api/, so this job never calls the live API.
  image-and-e2e:
    runs-on: ubuntu-latest
    outputs:
      # The tested image's ID, so `publish` can check it pushes exactly this image (M5 plan D34)
      image-id: ${{ steps.build.outputs.image-id }}
    env:
      # Trivy's official image, pinned by digest (v0.76.1, M4 plan D23). Dependabot can't update a
      # digest inside a `docker run`, so this is updated by hand: see docs/vulnerability-triage.md.
      TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the production image
        id: build
        # DEXTER_COMMIT becomes /version.txt (M5 plan D35). On a pull request, GITHUB_SHA is the
        # temporary merge commit GitHub tests; on main, it's the commit that gets deployed.
        run: |
          docker build --build-arg DEXTER_COMMIT="$GITHUB_SHA" --tag dexter:ci .
          echo "image-id=$(docker image inspect dexter:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"

      # Vulnerability scanning with Trivy (M4 plan D23), before the image is tested.
      # - The image is handed to Trivy as a file, so Trivy never gets control of Docker itself.
      # - `-w /scan` lets Trivy find a .trivyignore (written exceptions with reasons) if there is one.
      # - Each target is scanned twice. The report lists every finding, fixable or not, and never
      #   fails. The gate fails the job on HIGH or CRITICAL findings that have a fix available.
      # - package-lock.json includes dev dependencies: they run here in CI and in the image build.
      - name: Save the image to a file for scanning
        run: docker save --output dexter-image.tar dexter:ci

      - name: "Trivy report: the image (every finding)"
        run: docker run --rm -v "$PWD:/scan:ro" -w /scan -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --input dexter-image.tar

      - name: "Trivy report: package-lock.json (every finding)"
        run: docker run --rm -v "$PWD:/scan:ro" -w /scan -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" fs --scanners vuln --include-dev-deps package-lock.json

      - name: "Trivy gate: the image (fails on fixable HIGH/CRITICAL)"
        run: docker run --rm -v "$PWD:/scan:ro" -w /scan -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --input dexter-image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: "Trivy gate: package-lock.json (fails on fixable HIGH/CRITICAL)"
        # Also runs when the image gate has failed, so one failure can't hide the other
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/scan:ro" -w /scan -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" fs --scanners vuln --include-dev-deps package-lock.json --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      # The image needs its runtime configuration (M5 plan D32) or it won't start. "ci" is a test
      # run's name, not one of the two environments (local and production).
      - name: Start the container
        run: >-
          docker run --detach --name dexter --publish 8080:8080
          -e DEXTER_ENVIRONMENT=ci
          -e DEXTER_API_BASE_URL=https://pokeapi.co/api/v2
          dexter:ci

      - name: Wait until the container answers
        run: curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8080/healthz

      - name: "/version.txt names the commit this image was built from"
        run: |
          served="$(curl --fail --silent --show-error http://localhost:8080/version.txt)"
          echo "version.txt: $served"
          test "$served" = "$GITHUB_SHA"

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the E2E tests
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          # The footer, /config.js and the CSP must show what the container was started with (above)
          E2E_EXPECTED_ENVIRONMENT: ci
          E2E_EXPECTED_API_BASE_URL: https://pokeapi.co/api/v2

      # One image, every environment (brief §3.4, M5 plan R5): a second container from the SAME
      # dexter:ci image, nothing rebuilt, with different values. The runtime-config tests must now see
      # the new values. api.example.test is a made-up address; the browser test never lets a request out.
      - name: "One image, other config: start a second container from the same image"
        run: |
          docker run --detach --name dexter-other --publish 8081:8080 \
            -e DEXTER_ENVIRONMENT=demo \
            -e DEXTER_API_BASE_URL=https://api.example.test/v1 \
            dexter:ci
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8081/healthz
          # Both containers run the very same image (same ID)
          first="$(docker inspect --format '{{.Image}}' dexter)"
          second="$(docker inspect --format '{{.Image}}' dexter-other)"
          echo "first container:  $first"
          echo "second container: $second"
          test "$first" = "$second"

      - name: "One image, other config: the app follows the second configuration"
        run: npx playwright test e2e/runtime-config.spec.ts e2e/runtime-config-browser.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8081
          E2E_EXPECTED_ENVIRONMENT: demo
          E2E_EXPECTED_API_BASE_URL: https://api.example.test/v1

      # A missing or unsafe setting must stop the container before nginx serves anything
      - name: "One image, bad config: the container refuses to start"
        run: |
          refuses() {
            # `timeout`: a container that wrongly started would keep running; it then fails the grep below
            if output="$(timeout 30 docker run --rm "$@" dexter:ci 2>&1)"; then
              echo "::error::The container started with: $*"; exit 1
            fi
            echo "$output" | grep "Dexter configuration error" || { echo "$output"; echo "::error::No configuration error for: $*"; exit 1; }
          }
          refuses -e DEXTER_ENVIRONMENT=ci
          refuses -e DEXTER_API_BASE_URL=https://pokeapi.co/api/v2
          refuses -e DEXTER_ENVIRONMENT=ci -e DEXTER_API_BASE_URL=http://pokeapi.co/api/v2
          refuses -e 'DEXTER_ENVIRONMENT=ci"};alert(1)//' -e DEXTER_API_BASE_URL=https://pokeapi.co/api/v2

      # On main only, and only once every check above has passed: hand the tested image (the same file
      # Trivy scanned) to the `publish` job, so the image pushed is the one tested, never a rebuild.
      - name: Keep the tested image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dexter-image
          path: dexter-image.tar
          retention-days: 1
          if-no-files-found: error

      # On failure: the HTML report (with screenshots and step-by-step traces) to download from the run's page
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Show the containers' logs
        if: failure()
        run: |
          docker logs dexter
          docker logs dexter-other || true

  # Publishes the tested image to GitHub Container Registry (M5 plan R6, D31, D34): brief §3.6, "on merge
  # to main: builds and pushes the image". Runs on pushes to main only (merged pull requests), never on
  # a pull request, and only after both jobs above have passed.
  # It never builds anything: it loads the exact image file image-and-e2e built, scanned and tested.
  publish:
    needs: [lint-and-typecheck, image-and-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One publish at a time, so two quick merges can't push :main at the same moment. A running
    # publish is never cancelled; a newer one waits for it.
    concurrency:
      group: publish
      cancel-in-progress: false
    # The only job allowed to write packages. GITHUB_TOKEN gets this permission for this job only;
    # no personal token or stored password is needed.
    permissions:
      packages: write
    outputs:
      # The pushed image's digest (sha256:…), for the deploy job (R8) to deploy exactly this image
      digest: ${{ steps.push.outputs.digest }}
    env:
      # ghcr.io/<owner>/<repository>: ghcr.io/jenine-vertexpm/dexter
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dexter-image

      - name: Load the tested image and check it is the same one
        env:
          TESTED_IMAGE_ID: ${{ needs.image-and-e2e.outputs.image-id }}
        run: |
          docker load --input dexter-image.tar
          loaded="$(docker image inspect dexter:ci --format '{{.Id}}')"
          echo "tested: $TESTED_IMAGE_ID"
          echo "loaded: $loaded"
          test -n "$TESTED_IMAGE_ID" && test "$loaded" = "$TESTED_IMAGE_ID"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Two tags for one image: sha-<commit> never moves (this exact build); main always points to the
      # newest image from main. The digest identifies the image itself, whatever its tags.
      - name: Tag and push the image
        id: push
        run: |
          # Stop if any part of a pipeline fails (imagetools inspect | jq), not only its last command
          set -o pipefail
          docker tag dexter:ci "$IMAGE:sha-$GITHUB_SHA"
          docker tag dexter:ci "$IMAGE:main"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:main"
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          main_digest="$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "sha-$GITHUB_SHA: $digest"
          echo "main: $main_digest"
          # Separate commands: `bash -e` stops at the first one that fails (it doesn't inside an && list)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Not a valid digest: '$digest'"; exit 1; }
          [[ "$digest" == "$main_digest" ]] || { echo "::error::sha-$GITHUB_SHA and main point to different images"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Proves the registry copy works: pulled back by digest, started with runtime config, and it
      # names this commit in /version.txt
      - name: Pull the published image back and check it
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker image rm "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:main" dexter:ci
          docker pull "$IMAGE@$DIGEST"
          docker run --detach --name published --publish 8080:8080 \
            -e DEXTER_ENVIRONMENT=ci -e DEXTER_API_BASE_URL=https://pokeapi.co/api/v2 \
            "$IMAGE@$DIGEST"
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8080/healthz
          served="$(curl --fail --silent --show-error http://localhost:8080/version.txt)"
          echo "version.txt: $served"
          test "$served" = "$GITHUB_SHA"

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo "- \`$IMAGE:sha-$GITHUB_SHA\`"
            echo "- \`$IMAGE:main\`"
            echo "- digest \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  # Deploys the image `publish` just pushed to Render, by digest, then proves it's live (M5 plan R8,
  # D34–D37): brief §3.6, "then deploys that same image". Pushes to main only, after `publish` passes.
  # Render never builds anything and doesn't watch the registry: image-backed services only deploy
  # when asked, here through the service's deploy hook.
  deploy:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Cold start + image pull + the 15-minute wait below, with room to spare
    timeout-minutes: 30
    # One deploy at a time: a running deploy is never cancelled, and a newer one waits for it. If
    # several merges queue up, GitHub keeps only the newest waiting run, so a middle deploy can be
    # skipped; the site still ends up on the newest image (decision accepted for R8).
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # The same image path render.yaml gives Render: Render rejects an imgURL with any other path
      IMAGE: ghcr.io/${{ github.repository }}
      # Repository variable (not a secret): https://dexter-….onrender.com
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      # Checks every input first, so a missing setting fails here instead of halfway through
      - name: Check the deploy settings
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          [[ -n "$RENDER_DEPLOY_HOOK" ]] || { echo "::error::The repository secret RENDER_DEPLOY_HOOK is missing or empty"; exit 1; }
          [[ "$PRODUCTION_URL" =~ ^https://[^/]+$ ]] || { echo "::error::The repository variable PRODUCTION_URL must be https://<host> with no path or trailing slash, not '$PRODUCTION_URL'"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::publish gave no valid digest: '$DIGEST'"; exit 1; }
          echo "Deploying $IMAGE@$DIGEST to $PRODUCTION_URL"

      # The hook URL is a secret (whoever has it can trigger deploys). GitHub hides its full value in
      # logs; the key inside it is also hidden on its own (::add-mask::), and the URL is never printed.
      # imgURL picks the exact image for this deploy only (Render docs, "Deploy a prebuilt Docker
      # image"); render.yaml's :main stays the service's default. curl URL-encodes it and adds it with
      # `&`, because the hook URL already has `?key=…`:
      #   …/deploy/srv-…?key=…&imgURL=ghcr.io%2Fjenine-vertexpm%2Fdexter%40sha256%3A…
      # Render answers 200 (deploy started), 202 (queued behind a deploy in progress), or an error
      # such as 400 (imgURL rejected), 404 (wrong or regenerated key) or 409 (service suspended).
      - name: Ask Render to deploy this exact image
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          key="${RENDER_DEPLOY_HOOK#*key=}"
          echo "::add-mask::${key%%&*}"
          status="$(curl --silent --show-error --max-time 60 --output render-response.txt --write-out '%{http_code}' \
            --request POST --get --data-urlencode "imgURL=$IMAGE@$DIGEST" "$RENDER_DEPLOY_HOOK")"
          echo "Render answered HTTP $status: $(head -c 500 render-response.txt)"
          case "$status" in
            200) echo "Render started the deploy" ;;
            202) echo "Render queued the deploy behind one already in progress" ;;
            *) echo "::error::Render refused the deploy (HTTP $status)"; exit 1 ;;
          esac

      # Proof the deploy finished: /version.txt names the commit the image was built from (D35).
      # The previous version keeps serving until the new one is healthy, so this waits for the switch.
      # If it never happens (image pull failed, container refused to start), Render keeps the previous
      # version running and this job fails after 15 minutes. /version.txt is served with no-cache.
      - name: Wait until the live site runs this commit
        run: |
          deadline=$((SECONDS + 15 * 60))
          while true; do
            served="$(curl --silent --max-time 30 "$PRODUCTION_URL/version.txt" || true)"
            if [[ "$served" == "$GITHUB_SHA" ]]; then
              echo "Live: $PRODUCTION_URL is running $served"
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::After 15 minutes $PRODUCTION_URL/version.txt still says '${served:0:80}', not $GITHUB_SHA. Check the deploy in the Render dashboard; the previous version is still serving."
              exit 1
            fi
            echo "Still waiting: the site says '${served:0:80}'"
            sleep 15
          done

      # The deployed checks (D36): the security headers (brief §3.5, "check the headers on the deployed
      # site in CI") and the production runtime config. Both specs only send requests, so no browser is
      # installed, and they never use PokéAPI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the live site's headers and runtime config
        run: npx playwright test e2e/headers.spec.ts e2e/runtime-config.spec.ts
        env:
          E2E_BASE_URL: ${{ vars.PRODUCTION_URL }}
          # Must match the production values in render.yaml
          E2E_EXPECTED_ENVIRONMENT: production
          E2E_EXPECTED_API_BASE_URL: https://pokeapi.co/api/v2

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          {
            echo "### Deployed"
            echo "- $PRODUCTION_URL"
            echo "- commit \`$GITHUB_SHA\`"
            echo "- image \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
