name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # Builds the real production image, starts it, and runs the Playwright browser tests against it
  # (M4 plan D19, D24). PokéAPI answers come from e2e/fixtures/api/, so this job never calls the live API.
  image-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the production image
        run: docker build --tag dexter:ci .

      - name: Start the container
        run: docker run --detach --name dexter --publish 8080:8080 dexter:ci

      - name: Wait until the container answers
        run: curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8080/healthz

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the E2E tests
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8080

      # On failure: the HTML report (with screenshots and step-by-step traces) to download from the run's page
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Show the container's log
        if: failure()
        run: docker logs dexter
