# Security headers sent with every response (M4 plan §5.1, D21).
#
# nginx.conf includes this file in EVERY `location` block. That's on purpose: in nginx, an
# `add_header` inside a location (like the Cache-Control ones) replaces all add_header lines from
# the level above, so headers set once at the server level would silently disappear.
#
# `always` sends the header on every response, including errors such as a 404. Without it, nginx
# only adds headers to successful responses.

# Content Security Policy: the only places the browser may load things from. Everything else is
# blocked, so even if an attacker got markup into the page, the browser wouldn't run it.
#   default-src 'none'          block everything not listed below
#   script-src 'self'           only our own JavaScript files (no inline scripts, no eval)
#   style-src 'self'            only our own CSS files
#   img-src 'self' https://raw.githubusercontent.com
#                               our own images (the favicon) and the official artwork host
#   connect-src https://pokeapi.co
#                               the app may only fetch data from PokéAPI
#   base-uri 'none'             a <base> tag can't redirect the page's relative links elsewhere
#   form-action 'none'          no form may submit to any address (ours never submit; JS handles them)
#   frame-ancestors 'none'      no other site may show Dexter inside a frame (clickjacking)
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://raw.githubusercontent.com; connect-src https://pokeapi.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# HSTS: once seen over HTTPS, the browser uses only HTTPS for this site for a year. Browsers ignore
# it over plain http://localhost, so it does nothing locally. No includeSubDomains or preload: we
# won't own the parent domain of the M5 deployment.
add_header Strict-Transport-Security "max-age=31536000" always;

# Don't guess a file's type from its contents: trust the Content-Type we send
add_header X-Content-Type-Options "nosniff" always;

# Older browsers' version of frame-ancestors 'none'
add_header X-Frame-Options "DENY" always;

# Send no "which page did you come from" information to PokéAPI, GitHub or anyone else
add_header Referrer-Policy "no-referrer" always;

# Switch off browser features Dexter never uses
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
